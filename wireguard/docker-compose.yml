services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    environment:
      - WG_HOST=${WG_HOST}
      # Unattended setup: creates the admin account on first boot.
      # 2FA (TOTP) can't be set via env vars - enable it after login from the Account page in the UI.
      - INIT_ENABLED=true
      - INSECURE=false
      - INIT_USERNAME=${WG_USERNAME}
      - INIT_PASSWORD=${WG_PASSWORD}
      - INIT_HOST=${WG_HOST}
      - INIT_PORT=51820
    volumes:
      - ~/.wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    external: true

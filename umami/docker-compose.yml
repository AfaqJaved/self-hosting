services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    # ports:
    # - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/umami
      APP_SECRET: ${APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
    init: true
    restart: always
    networks:
      - nginx
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  nginx:
    external: true

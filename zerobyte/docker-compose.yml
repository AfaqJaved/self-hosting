services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:v0.43
    container_name: zerobyte
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    # ports:
    # - "4096:4096"
    devices:
      - /dev/fuse:/dev/fuse
    networks:
      - nginx
    environment:
      - TZ=Asia/Karachi # Set your timezone here
      - BASE_URL=${BASE_URL}
      - APP_SECRET=${APP_SECRET}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/lib/zerobyte:/var/lib/zerobyte
      - /home/afaqjaved/docker-volumes/:/docker-volumes

networks:
  nginx:
    external: true
